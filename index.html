<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Car Trader Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="error-banner" class="error-banner hidden"></div>

  <div class="app-shell">
    <aside id="app-header" class="app-sidebar hidden">
      <div class="brand">Car Trader Manager</div>
      <nav id="app-nav" class="app-nav">
        <a href="#/dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#/inventory" data-route="inventory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2.5" y="13" width="19" height="5.5" rx="1.5"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/></svg>
          <span class="nav-label">Inventory</span>
        </a>
        <a href="#/parts" data-route="parts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V21H3V8"/><path d="M1 3h22v5H1z"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
          <span class="nav-label">Parts</span>
        </a>
        <a href="#/sales" data-route="sales">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.83 0l4.59-4.59a2 2 0 0 0 0-2.83Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span class="nav-label">Sales</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="lang-toggle-btn" class="lock-btn" type="button">العربية</button>
        <button id="lock-btn" class="lock-btn" type="button">Lock</button>
      </div>
    </aside>

    <main id="app-root" class="app-main"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="helpers.js"></script>
  <script src="receipt.js"></script>
  <script src="flyer.js"></script>
  <script src="views/sale-dialog.js"></script>
  <script src="views/confirm-dialog.js"></script>
  <script src="views/login.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/inventory.js"></script>
  <script src="views/parts.js"></script>
  <script src="views/sales.js"></script>
  <script src="app.js"></script>
</body>
</html>
