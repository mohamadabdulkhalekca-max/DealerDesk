<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Car Trader Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="error-banner" class="error-banner hidden"></div>

  <header id="app-header" class="app-header hidden">
    <div class="brand">Car Trader Manager</div>
    <nav id="app-nav" class="app-nav">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/inventory" data-route="inventory">Inventory</a>
      <a href="#/sales" data-route="sales">Sales</a>
      <button id="lock-btn" class="lock-btn" type="button">Lock</button>
    </nav>
  </header>

  <main id="app-root"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="helpers.js"></script>
  <script src="receipt.js"></script>
  <script src="flyer.js"></script>
  <script src="views/sale-dialog.js"></script>
  <script src="views/confirm-dialog.js"></script>
  <script src="views/login.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/inventory.js"></script>
  <script src="views/sales.js"></script>
  <script src="app.js"></script>
</body>
</html>
